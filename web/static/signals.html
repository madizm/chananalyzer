<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>模型信号看板</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f6f8fb; color: #172033; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    h1 { margin: 0; font-size: 18px; line-height: 1.2; }
    nav { display: flex; gap: 10px; font-size: 13px; }
    nav a { color: #2563eb; text-decoration: none; }
    main { padding: 16px 18px 24px; }
    #message { display: none; margin-bottom: 12px; padding: 10px 12px; border: 1px solid #fed7aa; background: #fff7ed; color: #9a3412; border-radius: 6px; font-size: 13px; }
    #filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    select, input, button { height: 30px; border: 1px solid #d0d7e2; border-radius: 6px; background: #fff; padding: 0 8px; font-size: 13px; }
    input[type="number"] { width: 90px; }
    button { border-color: #2563eb; background: #2563eb; color: #fff; cursor: pointer; padding: 0 12px; }
    .summary-grid { display: grid; grid-template-columns: repeat(8, minmax(110px, 1fr)); gap: 8px; margin-bottom: 14px; }
    .metric { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; min-height: 66px; }
    .metric-label { color: #64748b; font-size: 12px; }
    .metric-value { margin-top: 6px; font-size: 20px; font-weight: 700; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
    .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #e5e7eb; font-weight: 700; font-size: 14px; }
    .stats-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 0; }
    .stats-block { padding: 10px 12px; border-right: 1px solid #e5e7eb; min-height: 110px; }
    .stats-block:last-child { border-right: 0; }
    .tiny-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tiny-table td { padding: 4px 0; border-bottom: 1px solid #f1f5f9; }
    #industry-stats td, #concept-stats td { padding-top: 3px; padding-bottom: 3px; line-height: 1.15; }
    .stat-link { border: 0; background: transparent; color: #2563eb; font: inherit; padding: 0; cursor: pointer; }
    .stat-link:hover { text-decoration: underline; }
    .bars { display: grid; gap: 4px; }
    .bar-line { display: grid; grid-template-columns: 58px minmax(120px, 1fr) 42px 48px; gap: 8px; align-items: center; font-size: 12px; }
    .bar-line { border-radius: 5px; cursor: pointer; padding: 2px 3px; }
    .bar-line:hover { background: #eff6ff; }
    .bar-line.is-selected { background: #dbeafe; outline: 1px solid #93c5fd; }
    .bar-track { display: block; height: 12px; border-radius: 999px; background: #e5e7eb; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(15, 23, 42, .04); }
    .bar-fill { display: block; height: 100%; min-width: 2px; border-radius: inherit; }
    .bar-fill.low { background: #94a3b8; }
    .bar-fill.mid { background: #2563eb; }
    .bar-fill.high { background: #dc2626; }
    .bar-pct { color: #64748b; text-align: right; font-variant-numeric: tabular-nums; }
    table.signals { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.signals th, table.signals td { padding: 8px 10px; border-bottom: 1px solid #eef2f7; text-align: left; white-space: nowrap; }
    table.signals th { background: #f8fafc; color: #475569; font-weight: 700; position: sticky; top: 0; }
    .table-wrap { max-height: calc(100vh - 360px); overflow: auto; }
    .side { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; padding: 3px 7px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 700; }
    .side.buy { background: #b91c1c; }
    .side.sell { background: #15803d; }
    .prob { font-weight: 700; }
    .chart-link { color: #2563eb; text-decoration: none; font-weight: 600; }
    .stock-name { display: flex; flex-direction: column; gap: 2px; line-height: 1.1; text-decoration: none; }
    .stock-code { color: #64748b; font-size: 11px; }
    @media (max-width: 1100px) {
      .summary-grid { grid-template-columns: repeat(4, minmax(120px, 1fr)); }
      .stats-row { grid-template-columns: 1fr; }
      .stats-block { border-right: 0; border-bottom: 1px solid #e5e7eb; }
      .stats-block:last-child { border-bottom: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>模型信号看板</h1>
    <nav>
      <a href="/chart">在线画图</a>
    </nav>
  </header>
  <main>
    <div id="message"></div>
    <form id="filters">
      <label>扫描批次 <select name="run_id"></select></label>
      <label>方向
        <select name="side">
          <option value="both">全部</option>
          <option value="buy">买</option>
          <option value="sell">卖</option>
        </select>
      </label>
      <label>行业 <select name="industry"><option value="all">全部</option></select></label>
      <label>概念 <select name="concept"><option value="all">全部</option></select></label>
      <label>开始 <input name="start_date" type="date" /></label>
      <label>结束 <input name="end_date" type="date" /></label>
      <label>最小概率 <input name="min_prob" type="number" min="0" max="1" step="0.01" value="0.60" /></label>
      <label>数量 <input name="limit" type="number" min="1" max="1000" step="1" value="200" /></label>
      <button type="submit">刷新</button>
    </form>
    <section class="summary-grid" id="summary"></section>
    <section class="panel" id="stats-panel">
      <div class="panel-title">统计分析</div>
      <div class="stats-row">
        <div class="stats-block">
          <strong>分数分布</strong>
          <div id="distribution" class="bars"></div>
        </div>
        <div class="stats-block">
          <strong id="side-stats-title">方向对比</strong>
          <table class="tiny-table"><tbody id="side-stats"></tbody></table>
        </div>
        <div class="stats-block">
          <strong id="industry-stats-title">行业统计</strong>
          <table class="tiny-table"><tbody id="industry-stats"></tbody></table>
        </div>
        <div class="stats-block">
          <strong id="concept-stats-title">概念统计</strong>
          <table class="tiny-table"><tbody id="concept-stats"></tbody></table>
        </div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-title">
        <span>高分信号</span>
        <span id="signal-count"></span>
      </div>
      <div class="table-wrap">
        <table class="signals">
          <thead>
            <tr>
              <th>名称</th>
              <th>行业</th>
              <th>方向</th>
              <th>时间</th>
              <th>概率</th>
              <th>价格</th>
              <th>笔</th>
              <th>背驰率</th>
              <th>收盘位</th>
              <th>子级别收盘位</th>
              <th>MA10距离</th>
              <th>图表</th>
            </tr>
          </thead>
          <tbody id="signals-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/static/signals.js?v=20260510-14"></script>
</body>
</html>
