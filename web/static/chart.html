<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChanAnalyzer 在线画图</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { margin: 0; height: 100%; background: #f6f8fb; color: #1f2937; }
    body { display: flex; flex-direction: column; }
    #topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; box-sizing: border-box; min-height: 72px; padding: 10px 14px; border-bottom: 1px solid #e5e7eb; background: #fff; }
    #left { display: flex; flex-direction: column; gap: 8px; min-width: 360px; }
    #title-row { display: flex; align-items: center; gap: 12px; }
    #title { font-size: 16px; font-weight: 700; white-space: nowrap; }
    #title-row a { color: #2563eb; font-size: 13px; text-decoration: none; }
    #query-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
    #query-form input, #query-form select { height: 28px; box-sizing: border-box; border: 1px solid #d0d7e2; border-radius: 6px; padding: 0 8px; font-size: 12px; background: #fff; }
    #query-form input[name="code"] { width: 94px; }
    #query-form input[name="begin"], #query-form input[name="end"] { width: 118px; }
    #query-form input[name="x_range"] { width: 70px; }
    #query-form button { height: 28px; border: 0; border-radius: 6px; padding: 0 12px; background: #2563eb; color: #fff; cursor: pointer; }
    #topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 0; }
    #controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .toggle-chip { border: 1px solid #d0d7e2; background: #fff; color: #475569; border-radius: 999px; font-size: 12px; line-height: 1; padding: 7px 10px; cursor: pointer; transition: all .15s ease; }
    .toggle-chip:hover { border-color: #94a3b8; color: #1e293b; }
    .toggle-chip.is-active { border-color: transparent; color: #fff; box-shadow: 0 4px 12px rgba(15, 23, 42, .12); }
    #legend { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: flex-end; font-size: 12px; color: #475569; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 999px; flex: 0 0 auto; }
    #message { display: none; padding: 8px 14px; background: #fff7ed; color: #9a3412; border-bottom: 1px solid #fed7aa; font-size: 12px; word-break: break-all; }
    #chart-wrap { position: relative; flex: 1; min-height: 0; }
    #chart { width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.72); color: #334155; font-size: 14px; z-index: 5; }
  </style>
  <script type="text/javascript" src="/charting_library/charting_library.min.js"></script>
</head>
<body>
  <div id="topbar">
    <div id="left">
      <div id="title-row">
        <div id="title">ChanAnalyzer 在线画图</div>
        <a href="/signals">模型信号</a>
        <a href="/sequence">BSP序列</a>
      </div>
      <form id="query-form">
        <input name="code" placeholder="股票代码" required />
        <select name="lv">
          <option value="day">日线</option>
          <option value="week">周线</option>
          <option value="60m">60分钟</option>
          <option value="30m">30分钟</option>
          <option value="15m">15分钟</option>
          <option value="5m">5分钟</option>
        </select>
        <input name="begin" placeholder="开始日期" />
        <input name="end" placeholder="结束日期" />
        <input name="x_range" type="number" min="0" placeholder="初始可见" title="初始可见K线数量，0为全部" aria-label="初始可见K线数量" />
        <select name="data_src">
          <option value="TDX">TDX</option>
          <option value="TUSHARE">TUSHARE</option>
          <option value="CACHE_DB">CACHE_DB</option>
          <option value="AKSHARE">AKSHARE</option>
          <option value="BAO_STOCK">BAO_STOCK</option>
        </select>
        <button type="submit">加载</button>
      </form>
    </div>
    <div id="topbar-right">
      <div id="controls"></div>
      <div id="legend"></div>
    </div>
  </div>
  <div id="message"></div>
  <div id="chart-wrap">
    <div id="chart"></div>
    <div id="loading">加载中...</div>
  </div>
  <script src="/static/chart.js?v=20260513-1"></script>
</body>
</html>
